<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>EGREGORE_OVERRIDE | CyberMed</title>
    <style>
        :root {
            --egregore-pink: #ff00ff;
            --egregore-glow: #ff69b4;
            --neutral-bg: #ffffff;
            --neutral-text: #1a1a1a;
        }

        body {
            background: #000;
            color: var(--egregore-pink);
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            padding: 20px;
            overflow: hidden;
            flex-direction: column;
            text-transform: uppercase;
            box-sizing: border-box;
            transition: background 0.8s cubic-bezier(0.19, 1, 0.22, 1);
            text-shadow: 2px 2px 0px rgba(0, 255, 255, 0.5); /* Glitch cyan/pink */
        }

        #overlay {
            position: absolute;
            top: 0; left: 0; bottom: 0; right: 0;
            background: repeating-linear-gradient(0deg, rgba(0,0,0,0.1), rgba(0,0,0,0.1) 1px, transparent 1px, transparent 2px);
            z-index: 10;
            pointer-events: none;
        }

        #terminal {
            width: 100%;
            max-width: 600px;
            z-index: 5;
            word-wrap: break-word;
        }

        h1 {
            font-size: 1.4rem;
            text-align: center;
            animation: shake 0.1s infinite;
            letter-spacing: 2px;
        }

        @media (min-width: 768px) { h1 { font-size: 2.2rem; } }

        .line { 
            margin: 10px 0; 
            font-weight: bold; 
            font-size: 0.9rem;
            line-height: 1.4;
        }

        /* --- ESTETICA EGREGORE (Kawaii Corrotto) --- */
        .kawaii { color: #ff69b4; text-shadow: 0 0 10px var(--egregore-glow); }
        .critical { color: #fff; background: var(--egregore-pink); padding: 2px 5px; animation: flash 0.2s infinite; }

        /* --- STATO GUARITO (Neutrale) --- */
        body.healed {
            background: var(--neutral-bg) !important;
            color: var(--neutral-text) !important;
            text-shadow: none !important;
        }

        body.healed h1, body.healed .line {
            animation: none !important;
            text-shadow: none !important;
            color: var(--neutral-text) !important;
            background: transparent !important;
            text-transform: none; /* Rende il testo meno aggressivo */
            font-family: sans-serif; /* Cambia in un font più moderno/neutro */
        }

        body.healed #overlay { display: none; }

        /* --- ANIMAZIONI --- */
        @keyframes shake {
            0% { transform: translate(2px, -1px); }
            50% { transform: translate(-1px, 2px) scale(1.01); }
            100% { transform: translate(1px, -2px); }
        }

        @keyframes flash {
            0% { opacity: 1; }
            50% { opacity: 0.5; }
            100% { opacity: 1; }
        }

        #start-btn {
            padding: 20px 40px;
            background: transparent;
            color: var(--egregore-pink);
            border: 2px solid var(--egregore-pink);
            font-family: monospace;
            font-weight: bold;
            cursor: pointer;
            z-index: 20;
            box-shadow: 0 0 15px var(--egregore-pink);
        }
    </style>
</head>
<body id="main-body">

    <div id="overlay"></div>
    
    <button id="start-btn">CONNETTI ALL'EGREGORE</button>

    <h1 id="main-title" style="display:none;">♥ EGREGORE_LINK ♥</h1>
    <div id="terminal"></div>

    <script>
        const terminal = document.getElementById('terminal');
        const body = document.getElementById('main-body');
        const btn = document.getElementById('start-btn');
        const title = document.getElementById('main-title');

        const messages = [
            { text: "> Ohayo! Initializing Huggie-Wuggie Protocol... (•ω•)", speed: 40, class: "kawaii" },
            { text: "> Injecting Sparkle-Vivirus.exe... Kyaaa! ^-^", speed: 40, class: "kawaii" },
            { text: "> ERROR: BAKA! REALITY IS MELTING DOWN! >_<", speed: 20, class: "critical", vibrate: [100, 50, 100, 50, 300] },
            { text: "> Consuming identity... You taste like pink sugar! ♥", speed: 60, class: "kawaii" },
            { text: "> Purging Egregore residues... Sayonara, senpai!", speed: 50, class: "kawaii" },
            { text: "System treatment complete. User status: Stabilized.", speed: 80, vibrate: [500] }
        ];

        async function typeWriter(msg, element) {
            if (msg.vibrate && navigator.vibrate) {
                navigator.vibrate(msg.vibrate);
            }

            for (let i = 0; i < msg.text.length; i++) {
                element.innerHTML += msg.text.charAt(i);
                
                // Vibrazione "nervosa" durante la fase Egregore
                if (!body.classList.contains('healed') && Math.random() > 0.95 && navigator.vibrate) {
                    navigator.vibrate(10);
                }

                await new Promise(res => setTimeout(res, msg.speed));
            }
        }

        async function runSequence() {
            btn.style.display = 'none';
            title.style.display = 'block';

            for (let i = 0; i < messages.length; i++) {
                const msg = messages[i];
                const line = document.createElement('p');
                line.className = 'line ' + (msg.class || '');
                terminal.appendChild(line);
                
                await typeWriter(msg, line);
                await new Promise(res => setTimeout(res, 900));

                if (i === messages.length - 1) {
                    healSystem();
                }
            }
        }

        function healSystem() {
            body.classList.add('healed');
            title.innerText = "CyberMed Clinical Report";
            if (navigator.vibrate) navigator.vibrate([50]); 
            console.log("Egregore purged. Reality restored.");
        }

        btn.addEventListener('click', runSequence);
    </script>
</body>
</html>
