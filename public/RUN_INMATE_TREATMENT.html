<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>RUN_TREATMENT | CyberMed</title>
    <style>
        :root {
            --neon-green: #00ff9c;
            --glitch-red: #ff0055;
            --glitch-blue: #00f0ff;
            --bg-color: #050505;
        }

        body {
            background: var(--bg-color);
            color: var(--neon-green);
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            padding: 20px; /* Spazio per i bordi su mobile */
            overflow: hidden;
            flex-direction: column;
            text-transform: uppercase;
            box-sizing: border-box;
            transition: background 0.3s ease, color 0.3s ease;
        }

        /* Effetto Scanline (disturbo video) */
        #overlay {
            position: absolute;
            top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.15) 50%), 
                        linear-gradient(90deg, rgba(255, 0, 0, 0.05), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.05));
            z-index: 10;
            background-size: 100% 3px, 3px 100%;
            pointer-events: none;
        }

        #terminal {
            width: 100%;
            max-width: 600px;
            z-index: 5;
            word-wrap: break-word; /* Evita che il testo esca dallo schermo */
        }

        h1 {
            font-size: 1.5rem; /* Più piccolo per i telefoni */
            letter-spacing: 2px;
            margin-bottom: 20px;
            text-align: center;
            animation: shake 0.15s infinite;
        }

        /* Media Query per schermi più grandi */
        @media (min-width: 768px) {
            h1 { font-size: 2.5rem; letter-spacing: 5px; }
        }

        .line { 
            margin: 8px 0; 
            min-height: 1.2em; 
            font-weight: bold; 
            font-size: 0.9rem; /* Testo leggibile su mobile */
        }

        @media (min-width: 768px) {
            .line { font-size: 1.1rem; }
        }

        .critical { color: var(--glitch-red); text-shadow: 0 0 5px var(--glitch-red); }

        /* --- STATO GUARITO --- */
        body.healed {
            background: #ffffff !important;
            color: #000000 !important;
        }

        body.healed h1, body.healed .line {
            animation: none !important;
            text-shadow: none !important;
            color: #000 !important;
        }

        body.healed #overlay { display: none; }

        @keyframes shake {
            0% { transform: translate(1px, 1px) rotate(0deg); }
            20% { transform: translate(-2px, -1px) rotate(-0.5deg); }
            40% { transform: translate(-1px, 2px) rotate(0.5deg); }
            60% { transform: translate(2px, 1px) rotate(0deg); }
            80% { transform: translate(-1px, -2px) rotate(-0.5deg); }
            100% { transform: translate(1px, 2px) rotate(0deg); }
        }

        /* Pulsante iniziale (i browser bloccano la vibrazione senza un'azione utente) */
        #start-btn {
            padding: 15px 30px;
            background: var(--neon-green);
            color: black;
            border: none;
            font-family: monospace;
            font-weight: bold;
            cursor: pointer;
            z-index: 20;
        }

        /* Pulsante Download - Appare solo alla fine */
        #download-btn {
            display: none; /* Nascosto inizialmente */
            margin-top: 30px;
            padding: 15px 30px;
            background-color: #000; /* Nero su bianco */
            color: #fff;
            border: none;
            font-family: 'Courier New', Courier, monospace;
            font-weight: bold;
            text-decoration: none;
            cursor: pointer;
            text-align: center;
            transition: transform 0.2s ease;
        }

        #download-btn:hover {
            transform: scale(1.05);
        }

        /* Quando il body ha la classe 'healed', mostra il pulsante */
        body.healed #download-btn {
            display: inline-block;
            animation: fadeIn 1.5s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
    </style>
</head>
<body id="main-body">

    <div id="overlay"></div>
    
    <button id="start-btn">START TREATMENT</button>

    <h1 id="main-title" style="display:none;">CYBERMED SYSTEM</h1>
    <div id="terminal"></div>

    <a id="download-btn" href="images/img download/medica_record_inmate.png" download="medical_record_inmate.png">
        GET RELEASE PAPERS
    </a>

    <script>
        const terminal = document.getElementById('terminal');
        const body = document.getElementById('main-body');
        const btn = document.getElementById('start-btn');
        const title = document.getElementById('main-title');

        const messages = [
            { text: "> INITIALIZING TREATMENT...", speed: 40, vibrate: [50] },
            { text: "> ANALYZING CORRUPTED SECTORS...", speed: 40 },
            { text: "> ERROR: REALITY OVERFLOW DETECTED!", speed: 20, class: "critical", vibrate: [100, 50, 100, 50, 300] },
            { text: "> REWRITING ARCHIVE DATA...", speed: 60 },
            { text: "> PURGING SIMULACRINE™ RESIDUE...", speed: 50 },
            { text: "> TREATMENT SUCCESSFUL. WELCOME BACK.", speed: 80, vibrate: [500] }
        ];

        

        async function typeWriter(msg, element) {
            // Se il messaggio ha un pattern di vibrazione, lo eseguiamo all'inizio della riga
            if (msg.vibrate && navigator.vibrate) {
                navigator.vibrate(msg.vibrate);
            }

            for (let i = 0; i < msg.text.length; i++) {
                element.innerHTML += msg.text.charAt(i);
                
                // Vibrazione leggera casuale durante l'errore critico
                if (msg.class === "critical" && Math.random() > 0.9 && navigator.vibrate) {
                    navigator.vibrate(20);
                }

                await new Promise(res => setTimeout(res, msg.speed));
            }
        }

        async function runSequence() {
            btn.style.display = 'none';
            title.style.display = 'block';

            for (let i = 0; i < messages.length; i++) {
                const msg = messages[i];
                const line = document.createElement('p');
                line.className = 'line ' + (msg.class || '');
                terminal.appendChild(line);
                
                await typeWriter(msg, line);
                await new Promise(res => setTimeout(res, 800));

                if (i === messages.length - 1) {
                    healSystem();
                }
            }
        }

      function healSystem() {
            body.classList.add('healed');
            
            // Cambia il titolo per riflettere lo stato neutrale/riabilitato
            title.innerText = "REHABILITATION COMPLETED";
            title.style.animation = "none"; // Ferma lo scuotimento
            
            // Vibrazione finale "secca" per confermare la guarigione
            if (navigator.vibrate) navigator.vibrate([100]); 
            
            console.log("Inmate neutralized. Status: Fit for release.");
        }

        btn.addEventListener('click', runSequence);
    </script>
</body>
</html>
